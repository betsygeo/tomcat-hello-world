apiVersion: v1
kind: Secret
metadata:
  name: secret-ref
  namespace: default
  labels:
    app.kubernetes.io/name: app
    kubernetes.azure.com/generator: container-copilot
type: Opaque
# Provide the sensitive data needed at runtime.
# These keys correspond to environment variables referenced in the Dockerfile.
stringData:
  DB_URL: "jdbc:your-database-host:3306/your-database-name"
  DB_USERNAME: "your-db-username"
  DB_PASSWORD: "your-db-password"